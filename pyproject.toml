[project]
name = "jev-preview"
version = "0.1.0"
description = "A terminal sandbox for the TypeSafe (Jev) System One API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arkady Buryakov", email = "arkady@buryakov.pro" }]
keywords = ["tui", "textual", "typesafe", "jev", "llm", "api", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual[syntax]>=1.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/arkadyb/jev-preview"
Repository = "https://github.com/arkadyb/jev-preview"
Issues = "https://github.com/arkadyb/jev-preview/issues"

[project.scripts]
jev-preview = "jev_preview.cli:main"
jev = "jev_preview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "textual-dev>=1.6",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_preview"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["jev_preview"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG", "TID"]
# RUF012: Textual's BINDINGS/CSS class attributes are lists by design
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
packages = ["jev_preview"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true
