name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 0.1.1)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    environment:
      name: aur
      url: https://aur.archlinux.org/packages/jev-preview
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm base-devel git openssh pacman-contrib namcap \
            python python-textual python-httpx python-platformdirs \
            python-build python-installer python-wheel python-hatchling

      - uses: actions/checkout@v4

      - name: Render PKGBUILD from template
        run: |
          version="${RELEASE_VERSION#v}"
          cd packaging/AUR
          sed "s/@VERSION@/$version/g" PKGBUILD.template > PKGBUILD
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder .
          # updpkgsums replaces the @SHA256@ placeholder with the real checksum
          runuser -u builder -- updpkgsums
          runuser -u builder -- sh -c 'makepkg --printsrcinfo > .SRCINFO'

      - name: Test build, lint, and smoke test
        run: |
          cd packaging/AUR
          runuser -u builder -- makepkg -f --noconfirm
          namcap PKGBUILD jev-preview-*.pkg.tar.zst
          pacman -U --noconfirm jev-preview-*.pkg.tar.zst
          # The installed package runs on system python, against the textual
          # in the official repositories rather than the pinned one.
          cd "$GITHUB_WORKSPACE"
          packaging/smoke-test /usr/bin

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version="${RELEASE_VERSION#v}"
          # Explicit paths only: ssh resolves ~ from the passwd entry (/root),
          # while the shell resolves it from $HOME (/github/home) — they differ
          # in container jobs. Host keys are pinned rather than keyscanned.
          mkdir -p /tmp/ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /tmp/ssh/aur
          chmod 600 /tmp/ssh/aur
          cat > /tmp/ssh/known_hosts <<'KEYS'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          KEYS
          export GIT_SSH_COMMAND="ssh -i /tmp/ssh/aur -o UserKnownHostsFile=/tmp/ssh/known_hosts -o IdentitiesOnly=yes"
          git config --global user.name "Arkady Buryakov"
          git config --global user.email "arkady@buryakov.pro"
          git clone ssh://aur@aur.archlinux.org/jev-preview.git /tmp/aur
          cp packaging/AUR/PKGBUILD packaging/AUR/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update to $version"
            git push origin HEAD:master
          fi
